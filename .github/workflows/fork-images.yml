name: Fork container images

on:
  workflow_dispatch:
    inputs:
      arm64:
        description: Also publish native ARM64 images
        type: boolean
        default: false
  push:
    branches: [preview, canary]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - turbo.json
      - .npmrc
      - .dockerignore
      - .github/workflows/fork-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'makeplane/plane'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.arm64 && '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"}]') }}
        image:
          - name: plane-frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
          - name: plane-space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - name: plane-admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - name: plane-live
            context: .
            dockerfile: apps/live/Dockerfile.live
          - name: plane-backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - name: plane-proxy
            context: apps/proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@v6
      - id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [plane-frontend, plane-space, plane-admin, plane-live, plane-backend, plane-proxy]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - name: Publish branch and commit tags
        working-directory: /tmp/digests
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          BRANCH_NAME: ${{ github.ref_name }}
          EXPECTED_DIGESTS: ${{ inputs.arm64 && '2' || '1' }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          BRANCH_TAG=$(printf '%s' "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g' | cut -c 1-120)
          DIGESTS=(*)
          test "${#DIGESTS[@]}" -eq "$EXPECTED_DIGESTS"
          REFERENCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            REFERENCES+=("${IMAGE}@sha256:${DIGEST}")
          done
          docker buildx imagetools create -t "${IMAGE}:${BRANCH_TAG}" -t "${IMAGE}:sha-${GITHUB_SHA}" "${REFERENCES[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"
