name: Version Change Before Release

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Compare proposed and base versions
        run: |
          PROPOSED_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show HEAD^1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$PROPOSED_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::The release must change package.json's version."
            exit 1
          fi
