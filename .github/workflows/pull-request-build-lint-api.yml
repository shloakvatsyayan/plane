name: Build and lint API

on:
  workflow_dispatch:
  push:
    branches: [preview]
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
      - ".github/workflows/pull-request-build-lint-api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine).
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      # Only the dev group (ruff) is needed to lint. --locked still fails the
      # job if uv.lock is out of date with pyproject.toml.
      - name: Install API Dependencies
        working-directory: apps/api
        run: uv sync --locked --only-group dev
      # No --fix: fixable violations must fail the job, not be rewritten on the runner.
      - name: Lint apps/api
        working-directory: apps/api
        run: uv run --no-sync ruff check .

  test-authentication:
    name: Test authentication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - name: Configure isolated test services
        run: cp apps/api/.env.example apps/api/.env
      - name: Run authentication regressions
        run: >-
          docker compose -f docker-compose-test.yml run --rm --build api-tests
          pytest plane/tests/unit/authentication/oidc plane/tests/contract/app/test_authentication.py
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
